userName: 
accessKey: 
framework: cucumber-js
#browserstack.playwrightVersion: '1.56.1'

parallelsPerPlatform: 2
platforms:
  - os: OS X
    osVersion: Ventura
    browserName: chrome
    browserVersion: latest

browserstackLocal: false
buildName: bstack-demo
projectName: Cucumber JS PW
CUSTOM_TAG_1: "sanity"
# Use CUSTOM_TAG_<N> and set more build tags as you need.
debug: true
consoleLogs: info
networkLogs: true
interactiveDebugging: true
#browserProfiling: true
logLevel: debug
browserstackAutomation: true

browserstack.selfHeal: true
percy: false
accessibility: false
accessibilityOptions:
    wcagVersion: wcag21aaa # Default: wcag21aa
    includeIssueType: 
        bestPractice: true # Default: false
        needsReview: true # Default: true
        experimental: true # Default: true